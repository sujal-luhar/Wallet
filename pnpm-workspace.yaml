packages:
  - apps/*
  - packages/*

# Native binaries allowed to execute build scripts during installation
allowBuilds:
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Centralized dependency catalog to enforce unified versions across all workspace packages
catalog:
  # Frameworks & Core Libraries
  next: 16.2.11
  react: 19.2.4
  react-dom: 19.2.4
  '@types/react': 19.2.2
  '@types/react-dom': 19.2.2
  typescript: 5.9.2

  # Standardized Node runtime types matching engine target
  "@types/node": ^20.19.0

  # Tooling & Code Quality
  eslint: ^9.39.1
  '@eslint/js': ^9.39.1
  typescript-eslint: ^8.50.0

  # Database & Prisma Accelerate
  prisma: 7.9.1
  '@prisma/client': 7.9.1

  # Auth & Security
  next-auth: ^4.24.15
  bcrypt: ^6.0.0
  '@types/bcrypt': ^6.0.0

  # UI, Styling & Utilities
  '@base-ui/react': ^1.8.0
  '@tailwindcss/postcss': ^4
  tailwindcss: ^4
  lucide-react: ^1.45.0
  recharts: ^3.8.0
  class-variance-authority: ^0.7.1
  cn: ^0.2.6
  tw-animate-css: ^1.4.0

  # Development Helpers
  dotenv: ^17.4.2
  tsx: ^4.23.1

minimumReleaseAge: 0